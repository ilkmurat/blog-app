server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the browser calls /api/*, nginx forwards to the backend (no CORS needed).
    location /api/ {
        client_max_body_size 25m;  # HR PDF uploads (API limit: 20 MB)
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chat agent: Server-Sent Events, so no buffering and long reads.
    location /agent/ {
        proxy_pass http://agent:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
