# Full stack: frontend (nginx) + backend API + Postgres + Qdrant + chat agent.
# Expects ../blog-api and ../blog-agent checked out next to this repo, and Ollama running on the host.
name: inkwell

include:
  - ../blog-api/docker-compose.yml
  - ../blog-agent/docker-compose.yml

services:
  web:
    build: .
    ports: ["3000:80"]
    depends_on:
      - api
      - agent
